# Backend + a local mail catcher. `docker compose up --build`, then:
#   API:        http://localhost:3000/api/v1/products/featured
#   Sales inbox: http://localhost:8025
services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on:
      mailpit:
        condition: service_started
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.29
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # SMTP, so `npm run dev` on the host can use it too
    restart: unless-stopped
